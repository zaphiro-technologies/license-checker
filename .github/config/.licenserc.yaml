# see https://github.com/marketplace/actions/license-eye-header#configurations

header:
  # this is not the actual license, but the desired compatibility
  license:
    spdx-id: Apache-2.0
    copyright-year: 2026
    copyright-owner: Zaphiro Technologies

  paths-ignore:
    - ".github"
    - ".docker"
    - "**/*.{md,MD}"
    - "examples/javascript/package-lock.json"
    - "examples/python-requirements/requirements.txt"
    - "package.json"
    - "LICENSE"
    - ".vscode"
    - "yarn.lock"

  comment: on-failure

# If you don't want to check dependencies' license compatibility, remove the following part
dependency:
  files:
    - package.json
    - yarn.lock
  exceptions:
    - name: spdx-exceptions
      version: "2.5.0"
      url: https://creativecommons.org/licenses/by/3.0/
      reason: >-
        Approved for the SPDX exception identifier data consumed by
        spdx-expression-parse; preserve the CC BY 3.0 attribution and license
        notice when distributing the action.
