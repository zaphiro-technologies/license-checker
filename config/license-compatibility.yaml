# Rules are checked in order; the first rule matching any license in an SPDX
# expression supplies its distribution review warning.
distribution-warnings:
  - prefixes: [AGPL-]
    message: "Distribution review: AGPL terms can require offering corresponding source to network users. Include required notices and review the license before distribution or deployment."
  - prefixes: [GPL-]
    message: "Distribution review: GPL terms can require distributing corresponding source and licensing covered combined work under GPL. Include required notices and the license text."
  - prefixes: [LGPL-]
    message: "Distribution review: LGPL terms require preserving notices and providing the license text; distribution of modified or combined work can create source and relinking obligations."
  - prefixes: [MPL-]
    message: "Distribution review: MPL terms require preserving notices and making covered source files available when distributing executable form."
  - licenses: [CAL-1.0]
    message: "Distribution review: CAL has reciprocal source, deployment, and user-autonomy obligations. Review its terms before providing the software to third parties."
  - licenses:
      [
        CDDL-1.0,
        CDDL-1.1,
        CPL-1.0,
        EPL-1.0,
        EPL-2.0,
        EUPL-1.2,
        OSL-3.0,
        CPAL-1.0,
      ]
    message: "Distribution review: This reciprocal license can impose notice and source-availability obligations when distributing covered software. Review its terms before release."

# These exceptions can change an otherwise incompatible result, subject to
# conditions that the checker cannot verify. The result is review-required by
# default and weak-compatible only when weak compatibility is explicitly enabled.
conditional-exceptions:
  - license-prefix: GPL-3.0
    exception: GCC-exception-3.1
