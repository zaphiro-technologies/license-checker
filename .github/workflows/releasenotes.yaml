name: Release Notes Management
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  pull_request_review:
  pull_request:
    types:
      - labeled
      - unlabeled
      - edited
      - synchronize
    branches: [main]
  release:
    types:
      - published

jobs:
  release-notes:
    uses: zaphiro-technologies/github-workflows/.github/workflows/release-notes.yaml@fix-tag-discovery
    secrets: inherit
