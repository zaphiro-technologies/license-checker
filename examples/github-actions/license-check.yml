name: Dependency license check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  license-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: zaphiro-technologies/license-checker@v1
        with:
          config: .licenserc.yaml
          token: ${{ github.token }}
          log: info
