name: Dependency License Compatibility
description: Check License Eye-compatible dependency licenses for JavaScript, Go, and Python projects.
author: Zaphiro Technologies
branding:
  icon: check-circle
  color: blue
inputs:
  config:
    description: Path to the License Eye-compatible YAML configuration file.
    required: false
    default: .licenserc.yaml
  token:
    description: GitHub token used to update pull-request comments on failure.
    required: false
    default: ${{ github.token }}
  log:
    description: "Log level: error, warn, info, or debug."
    required: false
    default: info
  weak-compatible:
    description: Treat conditional SPDX pairings as compatible during project-license checks.
    required: false
    default: "false"
  distribution:
    description: "Licensecompat model: internal-use, proprietary-binary, public-saas, open-source-redistribution, static-linking, or dynamic-linking."
    required: false
  report-all:
    description: Include compatible dependencies in the job summary.
    required: false
    default: "false"
runs:
  using: node24
  main: dist/index.js
