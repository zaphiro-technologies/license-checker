# Compatibility and license classification rules used by src/spdx.ts.
# Matrix values: compatible, warning, or incompatible.
aliases:
  Apache 2: Apache-2.0
  Apache 2.0: Apache-2.0
  Apache License 2.0: Apache-2.0
  Apache License, Version 2.0: Apache-2.0
  MIT License: MIT
  ISC license: ISC
  ISC License: ISC
  ISC License (ISCL): ISC
  BSD License: BSD-3-Clause
  BSD: BSD-3-Clause
  GPL-2.0+: GPL-2.0-or-later
  GPL-3.0+: GPL-3.0-or-later
  LGPL-2.1+: LGPL-2.1-or-later
  LGPL-3.0+: LGPL-3.0-or-later
  MPL 2.0: MPL-2.0
  Mozilla Public License 2.0: MPL-2.0
  MPL 1.1: MPL-1.1
  Mozilla Public License 1.1: MPL-1.1
  Public Domain: CC0-1.0

# These licenses require manual review when used in software.
review-required:
  licenses:
    - CC-BY-3.0
    - CC-BY-4.0

license-families:
  # Fallback groups used when a license has no explicit matrix group. These
  # describe checker behavior, not formal SPDX classifications. Members of
  # permissive-compatible match one another; reciprocal-compatible members
